<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng Nhập - Đường Lên Đỉnh Sogielia Mùa 7</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        body {
            justify-content: center;
        }
        .login-container {
            max-width: 450px;
            text-align: center;
        }
        .login-container h1 {
            font-size: 1.8rem;
            margin-bottom: 2rem;
        }
    </style>
</head>
<body>
    <div class="glass-container login-container">
        <h1>🌈 Đăng Nhập Hệ Thống</h1>
        <div id="alert-container"></div>
        
        <form action="/login" method="POST">
            <div class="form-group">
                <label for="username" style="text-align: left;">Tên tài khoản:</label>
                <input type="text" id="username" name="username" placeholder="Nhập tài khoản..." required>
            </div>
            <div class="form-group">
                <label for="password" style="text-align: left;">Mật khẩu:</label>
                <input type="password" id="password" name="password" placeholder="Nhập mật khẩu..." required>
            </div>
            <button type="submit">Đăng nhập</button>
        </form>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const alertContainer = document.getElementById('alert-container');
        if (urlParams.get('error')) {
            alertContainer.innerHTML = '<div class="alert alert-error">❌ Sai tên đăng nhập hoặc mật khẩu!</div>';
        }
    </script>
</body>
</html>
