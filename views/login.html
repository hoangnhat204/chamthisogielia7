<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng Nhập - Đường Lên Đỉnh Sogielia Mùa 7</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        body {
            justify-content: center;
        }
        .login-container {
            max-width: 450px;
            text-align: center;
            flex: 0 1 auto; /* Override flex: 1 */
            margin: auto;
        }
        .login-container h1 {
            font-size: 1.8rem;
            margin-bottom: 2rem;
        }

        /* Tối ưu riêng cho di động để vừa vặn 1 trang không cần cuộn */
        @media (max-width: 450px) {
            body { padding: 0.5rem; }
            .login-container { padding: 1.5rem 1rem; margin-top: 1rem; }
            .login-container h1 { font-size: 1.4rem; margin-bottom: 1rem; }
            .form-group label { font-size: 0.9rem; margin-bottom: 0.2rem; }
            input[type="text"], input[type="password"] { padding: 0.5rem; font-size: 0.9rem; }
            button[type="submit"] { padding: 0.6rem; font-size: 0.95rem; }
        }
    </style>
</head>
<body>
    <img src="/accset/logo.jpg" alt="Logo" class="site-logo">
    <div class="glass-container login-container">
        <h1>🌈 Đăng Nhập Hệ Thống</h1>
        <div id="alert-container"></div>
        
        <form action="/login" method="POST">
            <div class="form-group">
                <label for="username" style="text-align: left;">Tên tài khoản:</label>
                <input type="text" id="username" name="username" placeholder="Nhập tài khoản..." value="admin" required>
            </div>
            <div class="form-group">
                <label for="password" style="text-align: left;">Mật khẩu:</label>
                <input type="password" id="password" name="password" placeholder="Nhập mật khẩu..." value="matkhaula1" required>
            </div>
            <button type="submit">Đăng nhập</button>
        </form>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const alertContainer = document.getElementById('alert-container');
        const err = urlParams.get('error');
        if (err === '1') {
            alertContainer.innerHTML = '<div class="alert alert-error">❌ Sai tên đăng nhập hoặc mật khẩu!</div>';
        } else if (err === '2') {
            alertContainer.innerHTML = '<div class="alert alert-error">❌ Tài khoản của bạn đã bị khóa!</div>';
        }
    </script>
</body>
</html>
