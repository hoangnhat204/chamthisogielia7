<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trang Ban Giám Khảo - Chung Kết Sogielia Mùa 7</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        body {
            height: auto !important;
            min-height: 100vh;
            overflow-y: auto !important;
            padding-bottom: 2rem;
        }

        .judge-container {
            max-width: 800px;
            text-align: center;
            height: auto !important;
            overflow: visible !important;
        }

        .wizard-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            padding: 1rem;
            margin-top: 0.5rem;
            text-align: left;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
        }

        .round-badge {
            background: rgba(100, 255, 218, 0.15);
            color: var(--accent-blue);
            padding: 0.3rem 0.8rem;
            border-radius: 30px;
            font-size: 0.85rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            display: inline-block;
            text-transform: uppercase;
            letter-spacing: 1px;
            border: 1px solid var(--glass-border);
        }

        .candidate-name {
            font-size: 1.6rem;
            font-weight: 700;
            color: #fff;
            margin-bottom: 0.2rem;
            text-shadow: 0 0 10px rgba(100, 255, 218, 0.2);
        }

        .candidate-team {
            font-size: 0.9rem;
            color: var(--text-muted);
            margin-bottom: 0.5rem;
        }

        .score-display-big {
            font-size: 2.2rem;
            font-weight: 800;
            color: var(--accent-blue);
            text-align: center;
            margin-bottom: 0.3rem;
            text-shadow: 0 0 15px rgba(100, 255, 218, 0.4);
        }

        .score-section {
            margin: 0.5rem 0;
            padding-bottom: 0.5rem;
            border-bottom: 1px dashed rgba(255, 255, 255, 0.05);
        }

        .score-section:last-child {
            border-bottom: none;
        }

        .section-title {
            font-size: 0.95rem;
            color: var(--accent-blue);
            margin-bottom: 0.2rem;
            text-align: center;
        }

        .score-buttons-grid {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 0.5rem;
            width: 100%;
        }

        .score-btn {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--glass-border);
            color: var(--text-main);
            padding: 0.5rem 1rem;
            border-radius: 6px;
            font-size: 0.95rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: center;
            min-width: 48px;
            position: relative;
            z-index: 1;
        }

        .score-btn:hover {
            background: rgba(100, 255, 218, 0.1);
            border-color: var(--accent-blue);
            transform: translateY(-2px);
        }

        .score-btn.active {
            background-image: var(--lgbt-gradient);
            background-color: transparent;
            color: #fff;
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.4);
            border-color: transparent;
        }

        .score-btn.active::before {
            content: '';
            position: absolute;
            top: 0;
            right: 0;
            bottom: 0;
            left: 0;
            background: var(--lgbt-gradient);
            z-index: -1;
            border-radius: 6px;
            opacity: 1;
        }

        .wizard-buttons {
            display: flex;
            justify-content: center;
            margin-top: 0.5rem;
        }

        .progress-bar-container {
            width: 100%;
            height: 4px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 2px;
            margin-bottom: 0.5rem;
            overflow: hidden;
        }

        .progress-bar-fill {
            height: 100%;
            background: var(--accent-blue);
            width: 0%;
            transition: width 0.3s ease;
            box-shadow: 0 0 8px var(--accent-blue);
        }

        .step-indicator {
            font-size: 0.8rem;
            color: var(--text-muted);
            text-align: right;
            margin-bottom: 0.2rem;
            font-weight: 600;
        }

        .round-banner {
            font-size: 1rem;
            font-weight: 600;
            color: var(--accent-blue);
            margin-bottom: 0.5rem;
            text-align: center;
        }

        /* Tối ưu riêng cho di động để vừa vặn 1 trang không cần cuộn */
        @media (max-width: 768px) {
            body {
                padding: 0.3rem;
                height: auto;
                min-height: 100vh;
                overflow-y: auto;
            }

            .glass-container {
                padding: 0.5rem;
                height: auto;
                overflow: visible;
            }

            .scrollable-content {
                overflow: visible;
            }

            h1 {
                font-size: 1.1rem !important;
            }

            .round-banner {
                font-size: 0.8rem;
                margin-bottom: 0.2rem;
            }

            .wizard-card {
                padding: 0.5rem;
                margin-top: 0;
            }

            .candidate-name {
                font-size: 1.1rem;
                margin-bottom: 0;
            }

            .candidate-team {
                font-size: 0.75rem;
                margin-bottom: 0.2rem;
            }

            .section-title {
                font-size: 0.8rem;
                margin-bottom: 0;
            }

            .score-display-big {
                font-size: 1.2rem;
                margin-bottom: 0;
            }

            .score-section {
                margin: 0.2rem 0;
                padding-bottom: 0.2rem;
            }

            .score-buttons-grid {
                gap: 0.2rem;
            }

            .score-btn {
                padding: 0.3rem 0;
                font-size: 0.8rem;
                min-width: 40px;
            }

            .btn-success {
                padding: 0.5rem;
                font-size: 0.9rem;
                margin-top: 0.2rem;
            }

            .progress-bar-container {
                margin-bottom: 0.2rem;
            }

            .step-indicator {
                margin-bottom: 0;
            }
        }
    </style>
</head>

<body>
    <img src="/accset/logo.jpg" alt="Logo" class="site-logo">
    <div class="header-nav">
        <div id="user-profile" class="profile-bar"></div>
        <a href="/logout">🚪 Đăng xuất</a>
    </div>
    <div class="glass-container judge-container">
        <h1 style="font-size:1.5rem;margin-bottom:0.1rem;">Chấm điểm Chung Kết</h1>
        <div id="alert-container"></div>
        <div class="scrollable-content" style="width: 100%;">
            <div id="wizard-view">
                <div class="step-indicator" id="step-indicator-text">Thí sinh 1/1</div>
                <div class="progress-bar-container">
                    <div class="progress-bar-fill" id="progress-bar-fill"></div>
                </div>
                <div class="wizard-card">
                    <div class="round-badge" id="round-badge-text">Chung Kết</div>
                    <div id="round-theme-text"
                        style="font-size: 0.85rem; color: var(--text-muted); margin-bottom: 0.5rem; font-style: italic; display: none;">
                    </div>
                    <div class="candidate-name" id="cand-name-text">Nguyễn Văn A</div>
                    <form id="score-form" onsubmit="handleFormSubmit(event)">
                        <div id="criteria-container"></div>
                        <div class="score-section"
                            style="margin-top:1rem; border-top: 1px solid rgba(255,255,255,0.1); padding-top: 1rem;">
                            <div class="section-title">TỔNG ĐIỂM</div>
                            <div class="score-display-big" id="score-big-total">0.0đ</div>
                        </div>
                        <div class="wizard-buttons">
                            <button type="submit" class="btn-success" id="btn-submit" style="width:100%;">Gửi
                                Điểm</button>
                        </div>
                    </form>
                </div>
            </div>
            <div id="completion-view" style="display:none;padding:1.5rem 0;">
                <div class="section-card" style="text-align:center;">
                    <span style="font-size:4rem;">🏆</span>
                    <h2 id="completion-title" style="color:var(--accent-blue);margin-top:1rem;font-size:1.8rem;">Đã Hoàn
                        Thành Chấm Điểm</h2>
                    <p id="completion-desc" style="margin:0.5rem 0 1rem 0;color:var(--text-muted);font-size:0.95rem;">
                        Dưới đây là bảng điểm chung kết bạn đã gửi lên hệ thống:</p>

                    <div id="score-detail-wrapper">
                        <div class="table-responsive" style="margin:0.5rem 0;text-align:left;">
                            <table class="custom-table" style="font-size:0.9rem;">
                                <thead>
                                    <tr>
                                        <th>Thí sinh</th>
                                        <th style="text-align:center;width:120px;">Dạ Hội (V1)</th>
                                        <th style="text-align:center;width:140px;">Truyền Cảm Hứng (V6)</th>
                                        <th style="text-align:center;width:120px;">Ứng Xử (V7)</th>
                                        <th style="text-align:center;width:120px;">Thử Thách</th>
                                    </tr>
                                </thead>
                                <tbody id="summary-table-body"></tbody>
                            </table>
                        </div>
                    </div>

                    <div id="next-round-container" style="display:none; margin-top: 1.5rem;">
                        <button class="btn-success" id="btn-next-phase" style="width:100%; font-size: 1.1rem; padding: 0.8rem;">Tiếp Tục Chấm Vòng Tiếp Theo 🚀</button>
                    </div>

                    <p style="font-style:italic;font-size:0.85rem;color:var(--text-muted);margin-top:1rem;">⚠️ Điểm số
                        đã
                        lưu trữ chính thức và không được chỉnh sửa.</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        let currentUser = null;
        let appData = { users: [], teams: [], candidates: [], scores: [] };
        let currentCandidateIndex = 0;
        let currentRoundPhase = 1; // 1 = Vòng 1 (Dạ Hội), 2 = Vòng 6 (Truyền Cảm Hứng), 3 = Vòng 7 (Ứng Xử), 4 = Vòng Thử Thách
        let selectedCriteria = [];

        const criteriaR1 = [
            { name: "Thần thái", min: 1.0, max: 3.0, step: 0.5 },
            { name: "Kỹ năng trình diễn", min: 1.0, max: 3.0, step: 0.5 },
            { name: "Khả năng trình diễn trang phục dạ hội", min: 1.0, max: 2.0, step: 0.5 },
            { name: "Ấn tượng tổng thể", min: 1.0, max: 2.0, step: 0.5 }
        ];

        const criteriaR2 = [
            { name: "Nội dung, thông điệp", min: 1.0, max: 2.5, step: 0.5 },
            { name: "Câu chuyện và cảm xúc", min: 1.0, max: 2.5, step: 0.5 },
            { name: "Liên hệ bản thân với phong trào, hoạt động LGBTIQ+", min: 1.0, max: 3.0, step: 0.5 },
            { name: "Kỹ năng trình bày", min: 1.0, max: 2.0, step: 0.5 }
        ];

        const criteriaR3 = [
            { name: "Trả lời đúng trọng tâm (Đầy đủ yêu cầu, không lạc đề)", min: 1.0, max: 2.5, step: 0.5 },
            { name: "Quan điểm và lập luận (Rõ ràng, logic, có chiều sâu, thuyết phục)", min: 1.0, max: 2.5, step: 0.5 },
            { name: "Thông điệp và giá trị lan tỏa (Tích cực, ý nghĩa, tạo cảm hứng)", min: 1.0, max: 2.5, step: 0.5 },
            { name: "Kỹ năng trình bày (Tự tin, mạch lạc, truyền cảm, làm chủ thời gian)", min: 1.0, max: 2.5, step: 0.5 }
        ];

        const criteriaR4 = [
            { name: "Điểm Thử Thách", min: 1.0, max: 10.0, step: 0.5 }
        ];

        function getPhaseCandidates(phase) {
            let cand = [...(appData.candidates || [])];
            
            // Hàm hỗ trợ sắp xếp theo SBD tăng dần
            const sortBySBD = (a, b) => {
                const sbdA = parseInt(a.sbd || '999', 10);
                const sbdB = parseInt(b.sbd || '999', 10);
                return sbdA - sbdB;
            };

            if (phase === 1) {
                cand = cand.sort((a, b) => (a.orderR1 || 99) - (b.orderR1 || 99));
            } else if (phase === 2) {
                cand = cand.filter(c => c.selectedForR6).sort(sortBySBD);
            } else if (phase === 3) {
                cand = cand.filter(c => c.selectedForR7).sort(sortBySBD);
            } else if (phase === 4) {
                cand = cand.sort(sortBySBD);
            }
            return cand;
        }

        async function init() {
            await fetchSessionUser();
            await loadData(true);
            setInterval(() => {
                if (currentUser && !document.hidden) {
                    loadData(false, true);
                }
            }, 10000);
        }

        async function fetchSessionUser() {
            try {
                const res = await fetch('/api/session-user');
                if (res.ok) {
                    currentUser = await res.json();
                    renderProfileBar();
                } else {
                    window.location.href = '/login';
                }
            } catch (e) { console.error('Lỗi session', e); }
        }

        function renderProfileBar() {
            const p = document.getElementById('user-profile');
            if (currentUser) p.innerHTML = `👋 Giám khảo: <strong>${currentUser.username}</strong>`;
        }

        function showAlert(msg, type = 'success') {
            const c = document.getElementById('alert-container');
            c.innerHTML = `<div class="alert alert-${type}">${msg}</div>`;
            setTimeout(() => { c.innerHTML = ''; }, 3000);
        }

        async function loadData(auto = false, silent = false) {
            try {
                const r = await fetch('/api/data');
                if (r.ok) {
                    const newData = await r.json();
                    const modeChanged = appData.scoringMode && newData.scoringMode && appData.scoringMode !== newData.scoringMode;
                    
                    const oldMyScoresCount = (appData.scores || []).filter(s => currentUser && s.judge === currentUser.username).length;
                    const newMyScoresCount = (newData.scores || []).filter(s => currentUser && s.judge === currentUser.username).length;
                    const scoresArchived = (oldMyScoresCount > 0 && newMyScoresCount === 0);

                    appData = newData;

                    if (!silent) {
                        if (auto) resumeProgress(); else renderWizard();
                    } else if (modeChanged || scoresArchived) {
                        resumeProgress();
                    }
                }
            } catch (e) { console.error('load error', e); }
        }

        function resumeProgress() {
            const mode = appData.scoringMode || 'all';
            const modes = mode.split(',');

            const allowR1 = modes.includes('all') || modes.includes('r1');
            const allowR6 = modes.includes('all') || modes.includes('r6');
            const allowR7 = modes.includes('all') || modes.includes('r7');
            const allowR4 = modes.includes('all') || modes.includes('rThuThach');

            // Check phase 1
            if (allowR1) {
                let cands1 = getPhaseCandidates(1);
                for (let i = 0; i < cands1.length; i++) {
                    const s = appData.scores.find(v => v.candidateId === cands1[i].id && v.judge === currentUser.username);
                    if (!s || typeof s.aoDai === 'undefined') {
                        currentRoundPhase = 1;
                        currentCandidateIndex = i;
                        renderWizard();
                        return;
                    }
                }
                if (!allowR6 && !allowR7 && !allowR4) {
                    showCompletion(true, 1);
                    return;
                }
            }

            // Check phase 2
            if (allowR6) {
                let cands2 = getPhaseCandidates(2);
                let hasAnyR2 = false;
                for (let i = 0; i < cands2.length; i++) {
                    const s = appData.scores.find(v => v.candidateId === cands2[i].id && v.judge === currentUser.username);
                    if (s && typeof s.inspiration !== 'undefined') hasAnyR2 = true;
                    if (!s || typeof s.inspiration === 'undefined') {
                        if (allowR1 && !hasAnyR2 && cands2.length > 0) {
                            showCompletion(false, 1);
                            return;
                        }
                        currentRoundPhase = 2;
                        currentCandidateIndex = i;
                        renderWizard();
                        return;
                    }
                }
                if (!allowR7 && !allowR4) {
                    showCompletion(true, 2);
                    return;
                }
            }

            // Check phase 3
            if (allowR7) {
                let cands3 = getPhaseCandidates(3);
                let hasAnyR3 = false;
                for (let i = 0; i < cands3.length; i++) {
                    const s = appData.scores.find(v => v.candidateId === cands3[i].id && v.judge === currentUser.username);
                    if (s && typeof s.ungXu !== 'undefined') hasAnyR3 = true;
                    if (!s || typeof s.ungXu === 'undefined') {
                        if ((allowR1 || allowR6) && !hasAnyR3 && cands3.length > 0) {
                            showCompletion(false, 2);
                            return;
                        }
                        currentRoundPhase = 3;
                        currentCandidateIndex = i;
                        renderWizard();
                        return;
                    }
                }
            }

            // Check phase 4
            if (allowR4) {
                let cands4 = getPhaseCandidates(4);
                let hasAnyR4 = false;
                for (let i = 0; i < cands4.length; i++) {
                    const s = appData.scores.find(v => v.candidateId === cands4[i].id && v.judge === currentUser.username);
                    if (s && typeof s.thuThach !== 'undefined') hasAnyR4 = true;
                    if (!s || typeof s.thuThach === 'undefined') {
                        if ((allowR1 || allowR6 || allowR7) && !hasAnyR4 && cands4.length > 0) {
                            showCompletion(false, 3);
                            return;
                        }
                        currentRoundPhase = 4;
                        currentCandidateIndex = i;
                        renderWizard();
                        return;
                    }
                }
            }

            if (!allowR1 && !allowR6 && !allowR7 && !allowR4) {
                showCompletion(true, 0); // none allowed
            } else {
                showCompletion(true, allowR4 ? 4 : (allowR7 ? 3 : (allowR6 ? 2 : 1)));
            }
        }

        function startNextPhase(phase) {
            currentRoundPhase = phase;
            currentCandidateIndex = 0;
            renderWizard();
        }

        function renderWizard() {
            const w = document.getElementById('wizard-view');
            const c = document.getElementById('completion-view');
            const candidates = getPhaseCandidates(currentRoundPhase);

            if (candidates.length === 0) {
                w.innerHTML = `<p style="text-align:center;font-style:italic;">Không có thí sinh nào tham gia vòng ${currentRoundPhase === 1 ? 'Dạ Hội' : currentRoundPhase === 2 ? 'Truyền Cảm Hứng' : currentRoundPhase === 3 ? 'Ứng Xử' : 'Thử Thách'}.</p>`;
                return;
            }

            if (currentCandidateIndex >= candidates.length) currentCandidateIndex = candidates.length - 1;

            const cand = candidates[currentCandidateIndex];
            document.getElementById('cand-name-text').textContent = (cand.sbd ? `[SBD ${cand.sbd}] ` : '') + cand.name;

            const total = candidates.length;
            const step = currentCandidateIndex + 1;
            const roundNum = currentRoundPhase === 1 ? 1 : (currentRoundPhase === 2 ? 6 : (currentRoundPhase === 3 ? 7 : 'Thử Thách'));

            document.getElementById('step-indicator-text').textContent = `Thí sinh ${step} / ${total} - Vòng ${roundNum}`;
            document.getElementById('progress-bar-fill').style.width = `${step === 1 ? 5 : ((step - 1) / total) * 100}%`;

            const activeCriteria = currentRoundPhase === 1 ? criteriaR1 : (currentRoundPhase === 2 ? criteriaR2 : (currentRoundPhase === 3 ? criteriaR3 : criteriaR4));
            document.getElementById('round-badge-text').textContent = currentRoundPhase === 1 ? "Vòng 1: Dạ Hội" : (currentRoundPhase === 2 ? "Vòng 6: Truyền Cảm Hứng" : (currentRoundPhase === 3 ? "Vòng 7: Ứng Xử" : "Vòng Thử Thách"));

            const themeText = document.getElementById('round-theme-text');
            if (themeText) {
                themeText.style.display = 'none';
            }

            selectedCriteria = activeCriteria.map(() => null);
            renderCriteria(activeCriteria);
            updateTotalScore();

            w.style.display = 'block';
            c.style.display = 'none';
        }

        function renderCriteria(criteriaList) {
            const container = document.getElementById('criteria-container');
            let html = '';
            criteriaList.forEach((crit, index) => {
                html += `<div class="score-section">`;
                
                if (currentRoundPhase !== 4) {
                    html += `<div class="section-title" style="text-align:left; font-size: 0.95rem; margin-bottom: 0.5rem;">${index + 1}. ${crit.name}</div>`;
                }

                html += `<div class="score-buttons-grid" id="crit-btns-${index}">`;

                let val = crit.min !== undefined ? crit.min : 0;
                while (val <= crit.max + 0.001) {
                    let cleanVal = Math.round(val * 10) / 10;
                    html += `<div class="score-btn" onclick="selectCriterion(${index}, ${cleanVal})">${cleanVal.toFixed(1)}</div>`;
                    val += crit.step;
                }
                html += `</div></div>`;
            });
            container.innerHTML = html;
        }

        function selectCriterion(index, val) {
            selectedCriteria[index] = val;
            const btns = document.querySelectorAll(`#crit-btns-${index} .score-btn`);
            btns.forEach(b => {
                if (parseFloat(b.textContent) === val) b.classList.add('active');
                else b.classList.remove('active');
            });
            updateTotalScore();
        }

        function updateTotalScore() {
            let total = 0;
            let allSelected = true;
            selectedCriteria.forEach(v => {
                if (v === null) allSelected = false;
                else total += v;
            });
            document.getElementById('score-big-total').textContent = total.toFixed(1) + 'đ';
            const btn = document.getElementById('btn-submit');
            btn.disabled = !allSelected;
            if (!allSelected) {
                btn.style.opacity = '0.5';
                btn.style.cursor = 'not-allowed';
            } else {
                btn.style.opacity = '1';
                btn.style.cursor = 'pointer';
            }
        }

        async function handleFormSubmit(e) {
            e.preventDefault();
            if (selectedCriteria.includes(null)) {
                showAlert('❌ Vui lòng chấm đủ tất cả các tiêu chí!', 'error');
                return;
            }

            if (!confirm('Ban Giám Khảo chắc chắn gửi điểm này?')) {
                return;
            }

            const totalScore = selectedCriteria.reduce((a, b) => a + b, 0);
            const cand = getPhaseCandidates(currentRoundPhase)[currentCandidateIndex];
            const body = { candidateId: cand.id };
            if (currentRoundPhase === 1) {
                body.aoDai = totalScore;
                body.detailsR1 = JSON.stringify(selectedCriteria);
            } else if (currentRoundPhase === 2) {
                body.inspiration = totalScore;
                body.detailsR2 = JSON.stringify(selectedCriteria);
            } else if (currentRoundPhase === 3) {
                body.ungXu = totalScore;
                body.detailsR3 = JSON.stringify(selectedCriteria);
            } else {
                body.thuThach = totalScore;
            }

            try {
                const r = await fetch('/judge/score', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                    body: new URLSearchParams(body)
                });
                if (r.ok) {
                    await loadData(false, true);
                    currentCandidateIndex++;
                    const phaseCandidates = getPhaseCandidates(currentRoundPhase);
                    if (currentCandidateIndex >= phaseCandidates.length) {
                        if (currentRoundPhase === 1) {
                            showCompletion(false, 1);
                            showAlert('🎉 Đã chấm xong Vòng Dạ Hội!');
                        } else if (currentRoundPhase === 2) {
                            showCompletion(false, 2);
                            showAlert('🎉 Đã chấm xong Vòng Truyền Cảm Hứng!');
                        } else if (currentRoundPhase === 3) {
                            showCompletion(false, 3);
                            showAlert('🎉 Đã chấm xong Vòng Ứng Xử!');
                        } else {
                            showCompletion(true, 4);
                            showAlert('🎉 Đã hoàn thành chấm điểm tất cả các vòng!');
                        }
                    } else {
                        showAlert('✅ Đã lưu điểm.');
                        renderWizard();
                    }
                } else {
                    if (r.status === 401 || r.status === 403) {
                        showAlert('❌ Phiên đã hết hạn...', 'error');
                        setTimeout(() => { window.location.href = '/login'; }, 1500);
                        return;
                    }
                    const msg = await r.text();
                    showAlert(`❌ Lưu điểm thất bại: ${msg || 'Vui lòng thử lại!'}`, 'error');
                }
            } catch (err) {
                showAlert('❌ Lỗi kết nối máy chủ!', 'error');
            }
        }

        function showCompletion(isFinished = true, phaseDone = 0) {
            document.getElementById('wizard-view').style.display = 'none';
            const comp = document.getElementById('completion-view');
            comp.style.display = 'block';

            const nextBtn = document.getElementById('next-round-container');
            const btnEl = document.getElementById('btn-next-phase');
            if (nextBtn && btnEl) {
                const modes = (appData.scoringMode || 'all').split(',');
                const allowR6 = modes.includes('all') || modes.includes('r6');
                const allowR7 = modes.includes('all') || modes.includes('r7');
                const allowR4 = modes.includes('all') || modes.includes('rThuThach');

                if (phaseDone === 1 && allowR6 && getPhaseCandidates(2).length > 0) {
                    nextBtn.style.display = 'block';
                    btnEl.textContent = 'Tiếp Tục Chấm Vòng 6 🚀';
                    btnEl.onclick = () => startNextPhase(2);
                } else if (phaseDone === 2 && allowR7 && getPhaseCandidates(3).length > 0) {
                    nextBtn.style.display = 'block';
                    btnEl.textContent = 'Tiếp Tục Chấm Vòng 7 🚀';
                    btnEl.onclick = () => startNextPhase(3);
                } else if (phaseDone === 3 && allowR4 && getPhaseCandidates(4).length > 0) {
                    nextBtn.style.display = 'block';
                    btnEl.textContent = 'Tiếp Tục Chấm Vòng Thử Thách 🚀';
                    btnEl.onclick = () => startNextPhase(4);
                } else {
                    nextBtn.style.display = 'none';
                }
            }

            if (phaseDone === 0) {
                document.getElementById('completion-title').textContent = 'Chưa Có Vòng Thi Nào Được Mở';
                document.getElementById('completion-desc').textContent = 'Admin chưa mở quyền chấm điểm cho bất kỳ vòng thi nào. Vui lòng chờ!';
            } else if (phaseDone === 1) {
                document.getElementById('completion-title').textContent = 'Hoàn Thành Vòng 1';
                document.getElementById('completion-desc').textContent = 'Bạn đã chấm xong Vòng 1. Dưới đây là bảng điểm hiện tại. Hãy bấm nút bên dưới để chuyển sang Vòng 6.';
            } else if (phaseDone === 2) {
                document.getElementById('completion-title').textContent = 'Hoàn Thành Vòng 6';
                document.getElementById('completion-desc').textContent = 'Bạn đã chấm xong Vòng 6. Dưới đây là bảng điểm hiện tại. Hãy bấm nút bên dưới để chuyển sang Vòng 7.';
            } else if (phaseDone === 3) {
                document.getElementById('completion-title').textContent = 'Hoàn Thành Vòng 7';
                document.getElementById('completion-desc').textContent = 'Bạn đã chấm xong Vòng 7. Dưới đây là bảng điểm hiện tại. Hãy bấm nút bên dưới để chuyển sang Vòng Thử Thách.';
            } else if (phaseDone === 4) {
                document.getElementById('completion-title').textContent = 'Hoàn Thành Vòng Thử Thách';
                document.getElementById('completion-desc').textContent = 'Bạn đã chấm xong Vòng Thử Thách.';
            } else if (!isFinished) {
                document.getElementById('completion-title').textContent = 'Bảng Điểm Tạm Thời';
                document.getElementById('completion-desc').textContent = 'Bạn có thể xem lại điểm đã chấm. Bấm "Tiếp Tục Chấm Điểm" để quay lại.';
            } else {
                document.getElementById('completion-title').textContent = 'Đã Hoàn Thành Chấm Điểm';
                document.getElementById('completion-desc').textContent = 'Dưới đây là bảng điểm chung kết bạn đã gửi lên hệ thống:';
            }

            const tbody = document.getElementById('summary-table-body');
            tbody.innerHTML = '';
            (appData.candidates || []).forEach(c => {
                const s = appData.scores.find(v => v.candidateId === c.id && v.judge === currentUser.username) || {};

                let r1Html = '-';
                if (typeof s.aoDai !== 'undefined') {
                    r1Html = `<div style="font-weight:bold; color:var(--accent-blue); font-size:1.1rem;">${s.aoDai.toFixed(1)}đ</div>`;
                    if (s.details && s.details.r1) {
                        r1Html += `<div style="font-size:0.75rem; color:var(--text-muted); margin-top:0.2rem;">
                            [${s.details.r1.map(d => d + 'đ').join(' | ')}]
                        </div>`;
                    }
                }

                let r2Html = '-';
                if (c.selectedForR6) {
                    if (typeof s.inspiration !== 'undefined') {
                        r2Html = `<div style="font-weight:bold; color:#52c41a; font-size:1.1rem;">${s.inspiration.toFixed(1)}đ</div>`;
                        if (s.details && s.details.r2) {
                            r2Html += `<div style="font-size:0.75rem; color:var(--text-muted); margin-top:0.2rem;">
                                [${s.details.r2.map(d => d + 'đ').join(' | ')}]
                            </div>`;
                        }
                    } else {
                        r2Html = '<span style="color:var(--text-muted); font-style:italic;">Chưa chấm</span>';
                    }
                }

                let r3Html = '-';
                if (c.selectedForR7) {
                    if (typeof s.ungXu !== 'undefined') {
                        r3Html = `<div style="font-weight:bold; color:#ff9800; font-size:1.1rem;">${s.ungXu.toFixed(1)}đ</div>`;
                        if (s.details && s.details.r3) {
                            r3Html += `<div style="font-size:0.75rem; color:var(--text-muted); margin-top:0.2rem;">
                                [${s.details.r3.map(d => d + 'đ').join(' | ')}]
                            </div>`;
                        }
                    } else {
                        r3Html = '<span style="color:var(--text-muted); font-style:italic;">Chưa chấm</span>';
                    }
                }

                let r4Html = '-';
                if (typeof s.thuThach !== 'undefined') {
                    r4Html = `<div style="font-weight:bold; color:#e91e63; font-size:1.1rem;">${s.thuThach.toFixed(1)}đ</div>`;
                }

                const tr = document.createElement('tr');
                tr.innerHTML = `<td><strong>👤 ${c.sbd ? `[SBD ${c.sbd}] ` : ''}${c.name}</strong></td>
                                <td style="text-align:center;">${r1Html}</td>
                                <td style="text-align:center;">${r2Html}</td>
                                <td style="text-align:center;">${r3Html}</td>
                                <td style="text-align:center;">${r4Html}</td>`;
                tbody.appendChild(tr);
            });
        }

        window.addEventListener('DOMContentLoaded', init);
        document.addEventListener('visibilitychange', () => {
            if (!document.hidden && currentUser) {
                loadData(true);
            }
        });
    </script>
</body>

</html>
