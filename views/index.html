<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trang Chủ - Đường Lên Đỉnh Sogielia Mùa 7</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        .profile-bar {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--glass-border);
            padding: 0.5rem 1rem;
            border-radius: 8px;
            font-size: 0.9rem;
            color: var(--text-main);
        }
    </style>
</head>
<body>
    <img src="/accset/logo.jpg" alt="Logo" class="site-logo">
    <div class="header-nav">
        <div class="profile-bar" id="user-profile">
            <!-- JS populated -->
        </div>
        <div class="action-buttons" style="display: flex; gap: 0.5rem;">
            <a href="/admin" id="admin-link" style="display: none; margin-right: 1rem; align-self: center;">🔧 Vào Trang Admin</a>
            <a href="/logout">🚪 Đăng xuất</a>
        </div>
    </div>

    <!-- BẢNG XẾP HẠNG -->
    <div class="glass-container">
        <h1>🏆 Bảng Xếp Hạng Cuộc Thi</h1>
        
        <div class="admin-tabs" style="justify-content: center; margin-bottom: 1rem;">
            <button class="admin-tab active" onclick="switchBoardTab('aodai-container', event)">Phần Thi Áo Dài</button>
            <button class="admin-tab" onclick="switchBoardTab('inspiration-container', event)">Phần Thi Truyền Cảm Hứng</button>
        </div>

        <div id="aodai-container" class="tab-content" style="display: flex; flex-direction: column;">
            <div class="table-responsive">
                <table class="custom-table">
                    <thead>
                        <tr>
                            <th style="width: 70px; text-align: center;">Hạng</th>
                            <th>Thí sinh</th>
                            <th>Đội Mentor</th>
                            <th>Điểm từng BGK</th>
                            <th style="width: 100px; text-align: center;">Điểm TB</th>
                        </tr>
                    </thead>
                    <tbody id="aodai-board">
                        <tr><td colspan="5" style="text-align: center; font-style: italic;">Đang tải...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>

        <div id="inspiration-container" class="tab-content" style="display: none; flex-direction: column;">
            <div class="table-responsive">
                <table class="custom-table">
                    <thead>
                        <tr>
                            <th style="width: 70px; text-align: center;">Hạng</th>
                            <th>Thí sinh</th>
                            <th>Đội Mentor</th>
                            <th>Điểm từng BGK</th>
                            <th style="width: 100px; text-align: center;">Điểm TB</th>
                        </tr>
                    </thead>
                    <tbody id="inspiration-board">
                        <tr><td colspan="5" style="text-align: center; font-style: italic;">Đang tải...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        let currentUser = null;
        let appData = { users: [], teams: [], candidates: [], scores: [] };

        async function init() {
            await fetchSessionUser();
            await loadData();
        }

        async function fetchSessionUser() {
            try {
                const res = await fetch('/api/session-user');
                if (res.ok) {
                    currentUser = await res.json();
                    renderProfileBar();
                    if (currentUser.role === 'admin') {
                        document.getElementById('admin-link').style.display = 'inline-block';
                    }
                }
            } catch (err) {
                console.error('Lỗi khi lấy thông tin session:', err);
            }
        }

        function renderProfileBar() {
            const profile = document.getElementById('user-profile');
            if (!currentUser) return;
            
            let roleClass = 'badge-user';
            let roleText = 'Người xem';
            if (currentUser.role === 'admin') { roleClass = 'badge-admin'; roleText = 'Admin'; }
            else if (currentUser.role === 'judge') { roleClass = 'badge-judge'; roleText = 'Giám khảo'; }

            profile.innerHTML = `👋 Xin chào, <strong>${currentUser.username}</strong> <span class="badge ${roleClass}" style="margin-left: 0.5rem;">${roleText}</span>`;
        }

        function switchBoardTab(tabId, event) {
            document.getElementById('aodai-container').style.display = 'none';
            document.getElementById('inspiration-container').style.display = 'none';
            document.getElementById(tabId).style.display = 'flex';

            document.querySelectorAll('.admin-tab').forEach(el => el.classList.remove('active'));
            if (event) event.currentTarget.classList.add('active');
        }

        async function loadData() {
            try {
                const res = await fetch('/api/data');
                if (res.ok) {
                    appData = await res.json();
                    renderLeaderboard();
                } else {
                    document.getElementById('aodai-board').innerHTML = '<tr><td colspan="5" style="text-align: center; color: red;">Lỗi tải dữ liệu</td></tr>';
                    document.getElementById('inspiration-board').innerHTML = '<tr><td colspan="5" style="text-align: center; color: red;">Lỗi tải dữ liệu</td></tr>';
                }
            } catch (err) {
                console.error(err);
                document.getElementById('aodai-board').innerHTML = '<tr><td colspan="5" style="text-align: center; color: red;">Mất kết nối với máy chủ</td></tr>';
                document.getElementById('inspiration-board').innerHTML = '<tr><td colspan="5" style="text-align: center; color: red;">Mất kết nối với máy chủ</td></tr>';
            }
        }

        // Render Bảng xếp hạng
        function renderLeaderboard() {
            renderBoard('aoDai', 'aodai-board');
            renderBoard('inspiration', 'inspiration-board');
        }

        function renderBoard(type, tbodyId) {
            const tbody = document.getElementById(tbodyId);
            tbody.innerHTML = '';

            if (appData.candidates.length === 0) {
                tbody.innerHTML = '<tr><td colspan="5" style="text-align: center; font-style: italic;">Chưa có thí sinh nào tham gia.</td></tr>';
                return;
            }

            // Chỉ lấy các BGK đang hoạt động
            const judges = (appData.users || []).filter(u => u.role === 'judge' && u.status !== 'inactive');

            const rankedCandidates = appData.candidates.map(cand => {
                const candScores = appData.scores.filter(s => s.candidateId === cand.id);
                
                // Các điểm hợp lệ cho phần thi này
                const validScores = candScores.filter(s => typeof s[type] !== 'undefined');
                
                let sum = 0;
                let count = validScores.length;
                let judgeScoresHtml = [];

                judges.forEach(judge => {
                    const js = validScores.find(s => s.judge === judge.username);
                    if (js) {
                        sum += js[type];
                        judgeScoresHtml.push(`<span class="badge" style="background:#f0f0f0; color:#333; border:1px solid #ccc; font-size:0.8rem; margin:2px;">${judge.username}: <strong>${js[type]}</strong></span>`);
                    } else {
                        judgeScoresHtml.push(`<span class="badge" style="background:#fff; color:#aaa; border:1px dashed #eee; font-size:0.8rem; margin:2px;">${judge.username}: -</span>`);
                    }
                });

                const avgScore = count > 0 ? (sum / count) : null;
                
                return { 
                    ...cand, 
                    avgScore: avgScore,
                    judgeScoresHtml: judgeScoresHtml.join(' ') || '<span style="color:var(--text-muted); font-size:0.85rem; font-style:italic;">Chưa có điểm</span>'
                };
            });

            // Sắp xếp theo điểm trung bình giảm dần
            rankedCandidates.sort((a, b) => {
                if (a.avgScore === null && b.avgScore === null) return 0;
                if (a.avgScore === null) return 1;
                if (b.avgScore === null) return -1;
                return b.avgScore - a.avgScore;
            });

            rankedCandidates.forEach((cand, index) => {
                const tr = document.createElement('tr');
                
                let rankText = index + 1;
                let rankClass = '';
                if (index === 0) rankClass = 'rank-1';
                else if (index === 1) rankClass = 'rank-2';
                else if (index === 2) rankClass = 'rank-3';

                const avgDisplay = cand.avgScore !== null 
                    ? `<span class="badge btn-success" style="font-size: 0.95rem;">${cand.avgScore.toFixed(2)}</span>` 
                    : '<span style="color: var(--text-muted); font-style: italic;">Chưa chấm</span>';

                // Lấy Đội Mentor
                const team = appData.teams.find(t => t.id === cand.teamId);
                const teamDisplay = team 
                    ? `👥 <strong>${team.name}</strong> <span style="font-size:0.8rem; color:var(--text-muted);">(${team.mentors.join(' & ')})</span>`
                    : '<span style="color: var(--text-muted); font-style: italic;">Chưa gán đội</span>';

                tr.innerHTML = `
                    <td style="text-align: center;"><strong class="${rankClass}">${rankText}</strong></td>
                    <td><strong>👤 ${cand.sbd ? `[SBD ${cand.sbd}] ` : ''}${cand.name}</strong></td>
                    <td>${teamDisplay}</td>
                    <td style="line-height: 1.6; max-width: 300px;">${cand.judgeScoresHtml}</td>
                    <td style="text-align: center;">${avgDisplay}</td>
                `;
                tbody.appendChild(tr);
            });
        }

        // Khởi chạy khi DOM đã load
        window.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
